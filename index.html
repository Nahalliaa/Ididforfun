<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCWEBHOOK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        input, textarea, select {
            width: 100%;
            background: #141414;
            border: 1px solid #222;
            color: #e5e5e5;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #555;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover { opacity: 0.85; }
        
        button.ghost {
            background: transparent;
            border: 1px solid #333;
            color: #999;
        }
        
        button.ghost:hover {
            border-color: #555;
            color: #e5e5e5;
        }

        .section {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #999;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .webhook-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .webhook-item {
            padding: 10px 12px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
            font-size: 14px;
        }

        .webhook-item:hover {
            border-color: #444;
        }

        .webhook-item.active {
            border-color: #fff;
            background: #141414;
        }

        .webhook-item .delete {
            color: #666;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }

        .webhook-item .delete:hover {
            color: #e74c3c;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transform: translateY(100px);
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateY(0);
        }

        .toast.error {
            background: #e74c3c;
            color: #fff;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
        }

        .tab {
            padding: 10px 0;
            cursor: pointer;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .color-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-input input[type="color"] {
            width: 50px;
            height: 42px;
            padding: 4px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .upload-btn {
            width: 42px;
            padding: 10px;
            justify-content: center;
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
            
            .actions {
                width: 100%;
            }
            
            .actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">ARCWEBHOOK</div>
            <div class="actions">
                <button class="ghost" onclick="clearAll()">
                    <i class="fa-solid fa-trash"></i> Clear
                </button>
                <button onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i> Send
                </button>
            </div>
        </header>

        <div class="section">
            <div class="section-title">Webhook Settings</div>
            <div class="field">
                <label>Webhook URL</label>
                <input type="password" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
            </div>
            <div class="field">
                <label>Save As (Optional)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="webhookName" placeholder="My Webhook">
                    <button class="ghost" onclick="saveWebhook()" style="white-space: nowrap;">
                        <i class="fa-solid fa-save"></i> Save
                    </button>
                </div>
            </div>
            
            <div class="field" id="savedWebhooksSection" style="display: none;">
                <label>Saved Webhooks</label>
                <div class="webhook-list" id="webhookList"></div>
            </div>
        </div>

        <div class="section">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('simple')">Simple</div>
                <div class="tab" onclick="switchTab('embed')">Embed</div>
                <div class="tab" onclick="switchTab('json')">JSON</div>
            </div>

            <div id="tab-simple" class="tab-content active">
                <div class="field">
                    <label>Message Content</label>
                    <textarea id="msgContent" placeholder="Type your message here..." rows="6"></textarea>
                </div>
                <div class="grid">
                    <div class="field">
                        <label>Username Override</label>
                        <input type="text" id="msgUsername" placeholder="Bot Name">
                    </div>
                    <div class="field">
                        <label>Avatar URL</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="msgAvatar" placeholder="https://..." style="flex: 1;">
                            <button class="ghost upload-btn" onclick="uploadImage('msgAvatar')" title="Upload Image">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-embed" class="tab-content">
                <div class="field">
                    <label>Title</label>
                    <input type="text" id="embedTitle" placeholder="Embed Title">
                </div>
                <div class="field">
                    <label>Description</label>
                    <textarea id="embedDesc" placeholder="Embed description..." rows="4"></textarea>
                </div>
                <div class="grid">
                    <div class="field">
                        <label>Color</label>
                        <div class="color-input">
                            <input type="color" id="embedColor" value="#ffffff">
                            <input type="text" id="embedColorHex" value="#ffffff" maxlength="7" style="flex: 1;">
                        </div>
                    </div>
                    <div class="field">
                        <label>Footer</label>
                        <input type="text" id="embedFooter" placeholder="Footer text">
                    </div>
                </div>
                <div class="field">
                    <label>Image URL</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="embedImage" placeholder="https://..." style="flex: 1;">
                        <button class="ghost upload-btn" onclick="uploadImage('embedImage')" title="Upload Image">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="tab-json" class="tab-content">
                <div class="field">
                    <label>Raw JSON Payload</label>
                    <textarea id="jsonEditor" rows="12" style="font-family: 'Courier New', monospace;"></textarea>
                </div>
                <button class="ghost" onclick="formatJSON()">
                    <i class="fa-solid fa-code"></i> Format JSON
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    
    <input type="file" id="imageUploader" accept="image/*">

    <script>
        let state = {
            webhooks: [],
            currentTab: 'simple'
        };

        // Load saved webhooks
        function loadWebhooks() {
            const saved = localStorage.getItem('arc_webhooks');
            if (saved) {
                state.webhooks = JSON.parse(saved);
                renderWebhooks();
            }
        }

        function renderWebhooks() {
            const list = document.getElementById('webhookList');
            const section = document.getElementById('savedWebhooksSection');
            
            if (state.webhooks.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';
            list.innerHTML = '';
            
            state.webhooks.forEach((wh, idx) => {
                const item = document.createElement('div');
                item.className = 'webhook-item';
                item.innerHTML = `
                    <span onclick="loadWebhook(${idx})">${wh.name}</span>
                    <i class="fa-solid fa-trash delete" onclick="deleteWebhook(${idx})"></i>
                `;
                list.appendChild(item);
            });
        }

        function saveWebhook() {
            const name = document.getElementById('webhookName').value.trim();
            const url = document.getElementById('webhookUrl').value.trim();
            
            if (!name || !url) {
                showToast('Name and URL required', true);
                return;
            }
            
            state.webhooks.push({ name, url });
            localStorage.setItem('arc_webhooks', JSON.stringify(state.webhooks));
            
            document.getElementById('webhookName').value = '';
            renderWebhooks();
            showToast('Webhook saved');
        }

        function loadWebhook(idx) {
            const wh = state.webhooks[idx];
            document.getElementById('webhookUrl').value = wh.url;
            showToast('Webhook loaded');
        }

        function deleteWebhook(idx) {
            if (confirm('Delete this webhook?')) {
                state.webhooks.splice(idx, 1);
                localStorage.setItem('arc_webhooks', JSON.stringify(state.webhooks));
                renderWebhooks();
                showToast('Webhook deleted');
            }
        }

        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if (tab === 'json') {
                syncToJSON();
            }
        }

        function syncToJSON() {
            const payload = buildPayload();
            document.getElementById('jsonEditor').value = JSON.stringify(payload, null, 2);
        }

        function buildPayload() {
            if (state.currentTab === 'json') {
                try {
                    return JSON.parse(document.getElementById('jsonEditor').value);
                } catch(e) {
                    return {};
                }
            }
            
            const payload = {};
            const content = document.getElementById('msgContent').value.trim();
            const username = document.getElementById('msgUsername').value.trim();
            const avatar = document.getElementById('msgAvatar').value.trim();
            
            if (content) payload.content = content;
            if (username) payload.username = username;
            if (avatar) payload.avatar_url = avatar;
            
            const title = document.getElementById('embedTitle').value.trim();
            const desc = document.getElementById('embedDesc').value.trim();
            
            if (title || desc) {
                const embed = {};
                if (title) embed.title = title;
                if (desc) embed.description = desc;
                
                const color = document.getElementById('embedColor').value;
                embed.color = parseInt(color.replace('#', ''), 16);
                
                const footer = document.getElementById('embedFooter').value.trim();
                if (footer) embed.footer = { text: footer };
                
                const image = document.getElementById('embedImage').value.trim();
                if (image) embed.image = { url: image };
                
                payload.embeds = [embed];
            }
            
            return payload;
        }

        async function sendMessage() {
            const url = document.getElementById('webhookUrl').value.trim();
            
            if (!url) {
                showToast('Webhook URL required', true);
                return;
            }
            
            const payload = buildPayload();
            
            if (!payload.content && !payload.embeds) {
                showToast('Message content required', true);
                return;
            }
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    showToast('Message sent!');
                } else {
                    showToast(`Error: ${response.status}`, true);
                }
            } catch(error) {
                showToast('Network error', true);
            }
        }

        function clearAll() {
            if (confirm('Clear all fields?')) {
                document.getElementById('msgContent').value = '';
                document.getElementById('msgUsername').value = '';
                document.getElementById('msgAvatar').value = '';
                document.getElementById('embedTitle').value = '';
                document.getElementById('embedDesc').value = '';
                document.getElementById('embedFooter').value = '';
                document.getElementById('embedImage').value = '';
                document.getElementById('jsonEditor').value = '';
                showToast('Fields cleared');
            }
        }

        function formatJSON() {
            try {
                const val = document.getElementById('jsonEditor').value;
                const obj = JSON.parse(val);
                document.getElementById('jsonEditor').value = JSON.stringify(obj, null, 2);
                showToast('JSON formatted');
            } catch(e) {
                showToast('Invalid JSON', true);
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Color picker sync
        document.getElementById('embedColor').addEventListener('input', (e) => {
            document.getElementById('embedColorHex').value = e.target.value;
        });

        document.getElementById('embedColorHex').addEventListener('input', (e) => {
            const val = e.target.value;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                document.getElementById('embedColor').value = val;
            }
        });

        // Initialize
        loadWebhooks();
        document.getElementById('jsonEditor').value = JSON.stringify({
            content: "Hello World",
            embeds: []
        }, null, 2);

        // Image Upload System
        let currentUploadTarget = null;

        function uploadImage(targetId) {
            currentUploadTarget = targetId;
            document.getElementById('imageUploader').click();
        }

        document.getElementById('imageUploader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file', true);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                document.getElementById(currentUploadTarget).value = base64;
                showToast('Image uploaded locally');
            };
            reader.readAsDataURL(file);
            
            // Reset file input
            e.target.value = '';
        });
    </script>
</body>
</html>
